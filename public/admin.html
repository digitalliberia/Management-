<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Liberia - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <nav class="navbar glass-nav fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="fas fa-shield-alt me-2"></i>Admin Portal - Digital Liberia</a>
            <button onclick="logout()" class="btn-glass-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </nav>

    <div class="container-fluid mt-5 pt-4">
        <div class="row">
            <div class="col-md-2 sidebar-glass">
                <div class="nav-list">
                    <a href="#" class="glass-nav-item active" onclick="showSection('employees')"><i class="fas fa-users"></i><span>Employees</span></a>
                    <a href="#" class="glass-nav-item" onclick="showSection('attendance')"><i class="fas fa-calendar-check"></i><span>Attendance</span></a>
                    <a href="#" class="glass-nav-item" onclick="showSection('reports')"><i class="fas fa-chart-line"></i><span>Reports</span></a>
                    <a href="#" class="glass-nav-item" onclick="showSection('payroll')"><i class="fas fa-money-bill"></i><span>Payroll</span></a>
                    <a href="#" class="glass-nav-item" onclick="showSection('announcements')"><i class="fas fa-bullhorn"></i><span>Announcements</span></a>
                    <a href="#" class="glass-nav-item" onclick="showSection('settings')"><i class="fas fa-cog"></i><span>Settings</span></a>
                </div>
            </div>
            <div class="col-md-10 main-glass">
                <div id="employeesSection">
                    <div class="glass-card-inner">
                        <div class="card-header-glass"><i class="fas fa-users"></i> Employee Management <button class="btn-glass-primary float-end" onclick="showAddEmployeeModal()"><i class="fas fa-plus"></i> Add Employee</button></div>
                        <div class="table-responsive">
                            <table class="glass-table" id="employeesTable">
                                <thead>
                                    <tr><th>Name</th><th>DSSN</th><th>Department</th><th>Position</th><th>Status</th><th>Actions</th></tr>
                                </thead>
                                <tbody id="employeesTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div id="attendanceSection" style="display: none;">
                    <div class="glass-card-inner">
                        <div class="card-header-glass"><i class="fas fa-calendar-check"></i> Today's Attendance</div>
                        <div class="table-responsive">
                            <table class="glass-table" id="attendanceTable">
                                <thead>
                                    <tr><th>Employee</th><th>Check In</th><th>Check Out</th><th>Hours</th><th>Status</th></tr>
                                </thead>
                                <tbody id="attendanceTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div id="reportsSection" style="display: none;">
                    <div class="glass-card-inner">
                        <div class="card-header-glass"><i class="fas fa-chart-line"></i> Attendance Reports</div>
                        <div class="row p-3">
                            <div class="col-md-4"><label>Start Date</label><input type="date" id="reportStart" class="glass-input"></div>
                            <div class="col-md-4"><label>End Date</label><input type="date" id="reportEnd" class="glass-input"></div>
                            <div class="col-md-4"><label>&nbsp;</label><button onclick="generateReport()" class="btn-glass-primary w-100">Generate Report</button></div>
                        </div>
                        <div id="reportResults" class="p-3"></div>
                    </div>
                </div>
                <div id="payrollSection" style="display: none;">
                    <div class="glass-card-inner">
                        <div class="card-header-glass"><i class="fas fa-money-bill"></i> Payroll Management</div>
                        <div class="row p-3">
                            <div class="col-md-6"><label>Month</label><input type="month" id="payrollMonth" class="glass-input"></div>
                            <div class="col-md-6"><label>&nbsp;</label><button onclick="calculatePayroll()" class="btn-glass-primary w-100">Calculate Payroll</button></div>
                        </div>
                        <div id="payrollResults" class="p-3"></div>
                    </div>
                </div>
                <div id="announcementsSection" style="display: none;">
                    <div class="glass-card-inner">
                        <div class="card-header-glass"><i class="fas fa-bullhorn"></i> Post Announcement <button class="btn-glass-primary float-end" onclick="showAnnouncementModal()"><i class="fas fa-plus"></i> New Announcement</button></div>
                        <div id="adminAnnouncementsList" class="p-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Employee Modal -->
    <div class="modal fade" id="employeeModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-modal">
                <div class="modal-header glass-modal-header">
                    <h5><i class="fas fa-user-plus me-2"></i>Add Employee</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label>Full Name</label>
                        <input type="text" id="empName" class="glass-input" placeholder="John Doe">
                    </div>
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" id="empEmail" class="glass-input" placeholder="john@digitalliberia.com">
                    </div>
                    <div class="mb-3">
                        <label>DSSN</label>
                        <input type="text" id="empDSSN" class="glass-input" placeholder="PYGMNL94LR09Z24">
                    </div>
                    <div class="mb-3">
                        <label>Department</label>
                        <select id="empDepartment" class="glass-input">
                            <option>Engineering</option>
                            <option>Sales</option>
                            <option>HR</option>
                            <option>Finance</option>
                            <option>Operations</option>
                            <option>Management</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Position</label>
                        <input type="text" id="empPosition" class="glass-input" placeholder="Software Engineer">
                    </div>
                    <div class="mb-3">
                        <label>Phone</label>
                        <input type="text" id="empPhone" class="glass-input" placeholder="+231555123456">
                    </div>
                    <div class="mb-3">
                        <label>Salary (USD)</label>
                        <input type="number" id="empSalary" class="glass-input" placeholder="1500">
                    </div>
                    <div class="mb-3">
                        <label>Role</label>
                        <select id="empRole" class="glass-input">
                            <option value="employee">Employee</option>
                            <option value="admin">Admin</option>
                            <option value="super admin">Super Admin</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-glass-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn-glass-primary" onclick="addEmployee()">Add Employee</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
